<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แผนที่ที่อยู่ - {{ employee.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">📍 ที่อยู่ของ: {{ employee.name }} ({{ employee.emp_id }})</h4>
                <button class="btn btn-sm btn-light" onclick="window.close()">ปิดหน้านี้</button>
            </div>
            <div class="card-body">
                <p><strong>ที่อยู่ตามระบบ:</strong> {{ employee.address }} {{ employee.province }}</p>
                
                <!-- แผนที่ Google Maps -->
                <div class="ratio ratio-16x9">
                    <iframe 
                        src="https://maps.google.com/maps?q={{ employee.address }} {{ employee.province }}&t=&z=15&ie=UTF8&iwloc=&output=embed" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
