{% extends 'basetemplate.html' %}

{% block content %}
<style>
    .text-pastel-purple { color: #5a3d6b !important; }
    .bg-pastel-purple { background-color: #E2D1F9 !important; }
    .btn-pastel-purple { 
        background-color: #5a3d6b; 
        color: #ffffff; 
        border: none; 
    }
    .btn-pastel-purple:hover { 
        background-color: #483056; 
        color: #ffffff; 
    }
    input[type="password"] {
        display: block;
        width: 100%;
        padding: 0.5rem 0.85rem;
        font-size: 0.95rem;
        border: 1px solid #dee2e6;
        border-radius: 0.6rem;
        margin-top: 0.25rem;
        margin-bottom: 0.5rem;
    }
    ul.errorlist {
        color: #dc3545;
        font-size: 0.85rem;
        padding-left: 1.2rem;
        margin-bottom: 0.5rem;
    }
    .helptext {
        display: block;
        font-size: 0.8rem;
        color: #6c757d;
        margin-bottom: 0.75rem;
    }
</style>

<div class="container py-4 my-2">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4 pb-2 border-bottom">
                    <h3 class="fw-bold mb-1" style="color: #5a3d6b;">🔑 เปลี่ยนรหัสผ่าน</h3>
                    <p class="text-muted small mb-0">กรุณากรอกรหัสผ่านเดิมและตั้งรหัสผ่านใหม่</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        {{ form.as_p }}
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{% url 'profile' %}" class="btn btn-light rounded-pill px-4 text-muted fw-semibold border">
                            ← ยกเลิก
                        </a>
                        <button type="submit" class="btn btn-pastel-purple rounded-pill px-4 py-2 fw-bold shadow-sm">
                            ยืนยันการเปลี่ยนรหัส
                        </button>
                    </div>
                </form>

            </div>

        </div>
    </div>
</div>
{% endblock %}
